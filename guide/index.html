<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSLG 공략 자료실</title><link rel="stylesheet" href="../public_site.css"><style>
:root{font-family:Pretendard,system-ui,sans-serif;color:#172331;background:#F2F5F8}*{box-sizing:border-box}body{margin:0}.wrap{padding:22px max(16px,calc((100vw - 1680px)/2))}h1{font-size:26px;margin:6px 0}p{color:#4C6275}.tabs,.items{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.tabs button,.items button,.tools button,.tools select{font:700 14px Pretendard,system-ui,sans-serif;background:#fff;color:#203B56;border:1px solid #B9C9D9;border-radius:9px;padding:11px 15px;cursor:pointer;min-height:42px}.tabs .active,.items .active{color:white;background:#203B56}.items button{min-width:155px;max-width:260px;overflow-wrap:anywhere;text-align:left}.preview{margin-top:16px;background:white;border:1px solid #C9D4DF;border-radius:14px;overflow:hidden}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#EAF0F5;border-bottom:1px solid #C9D4DF;padding:12px}.tools strong{margin-right:auto}iframe{display:block;width:100%;height:80vh;border:0;background:white}.preview.fullscreen{position:fixed;z-index:999999;inset:0;border:0;border-radius:0;display:flex;flex-direction:column}.preview.fullscreen iframe{flex:1;min-height:0;height:auto}body.fullscreen{overflow:hidden}.empty{padding:18px;color:#586F82}.hint{font-size:13px;color:#53677A}
</style></head><body><nav class="nslg-pubnav"><a href="../">⚔ 전보분석기</a><a href="../catalog/">📖 도감 · 덱편성</a><a class="on" href="./">📚 공략 자료실</a><section class="nslg-pubnote" aria-label="공지사항"><strong class="nslg-pubnote-title">📢 공지사항</strong><span class="nslg-pubnote-body" data-nslg-notice-text>※ 전보 스크린샷은 디스코드 &quot;스크린샷&quot; 게시판에 올려주세요.
1. 교전 스크린샷   2. 전투결과(선택)</span></section></nav><main class="wrap"><h1>공략 · HTML 자료실</h1><p>모든 시즌의 공개 HTML 자료를 제목별로 열어 볼 수 있습니다. 파일 원본은 변경하지 않습니다.</p><section id="seasons" class="tabs"></section><section id="files" class="items"></section><section class="preview" id="preview" hidden><div class="tools"><strong id="title"></strong><label>높이 <select id="height"><option value="60">60%</option><option value="80" selected>80%</option><option value="90">90%</option></select></label><button id="full">⛶ 전체화면</button></div><iframe id="doc" title="공략 HTML" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe></section><p id="empty" class="empty"></p><p class="hint">※ 외부 사이트에서 가져온 HTML은 자체 이미지·스크립트 연결 방식에 따라 일부 표시가 달라질 수 있습니다.</p></main><script id="guide-data" type="application/json">[]</script><script>
(()=>{'use strict';const SEASONS=JSON.parse(document.getElementById('guide-data').textContent),sel=document.getElementById('seasons'),items=document.getElementById('files'),pane=document.getElementById('preview'),doc=document.getElementById('doc'),empty=document.getElementById('empty');let activeSeason=0,activeFile='';const h=document.getElementById('height');const H=new Set(['60','80','90']);let size='80';try{size=localStorage.getItem('nslg-public-guide-height')||'80'}catch(_){}if(!H.has(size))size='80';h.value=size;doc.style.height=size+'vh';h.onchange=()=>{size=h.value;if(!H.has(size))return;doc.style.height=size+'vh';try{localStorage.setItem('nslg-public-guide-height',size)}catch(_){}};
function fullOff(){pane.classList.remove('fullscreen');document.body.classList.remove('fullscreen');document.getElementById('full').textContent='⛶ 전체화면'}document.getElementById('full').onclick=()=>{const on=pane.classList.toggle('fullscreen');document.body.classList.toggle('fullscreen',on);document.getElementById('full').textContent=on?'↙ 전체화면 닫기':'⛶ 전체화면'};document.addEventListener('keydown',e=>{if(e.key==='Escape')fullOff()});
function files(){items.replaceChildren();fullOff();pane.hidden=true;doc.removeAttribute('src');activeFile='';const s=SEASONS[activeSeason];if(!s){empty.textContent='등록된 시즌이 없습니다.';return}empty.textContent=s.files.length?'':'이 시즌에 등록된 HTML이 없습니다.';for(const f of s.files){const b=document.createElement('button');b.textContent=f.title;b.onclick=()=>{activeFile=f.id;items.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('title').textContent=f.title;doc.src=f.url;pane.hidden=false;empty.textContent=''};items.append(b)}if(s.files.length)items.firstElementChild.click()}
function seasons(){sel.replaceChildren();SEASONS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name;b.className=i===activeSeason?'active':'';b.onclick=()=>{activeSeason=i;seasons();files()};sel.append(b)});files()}seasons();
})();
</script><script src="../public_notice.js" defer></script></body></html>
